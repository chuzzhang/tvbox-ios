name: build-ipa

on:
  push:
    branches: [main]
    paths:
      - 'tvbox-ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    # 建 Release 要写权限；仓库默认是 read（settings → Actions → Workflow permissions）
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 读版本号
        id: ver
        run: |
          M=$(grep -m1 'MARKETING_VERSION' tvbox-ios/project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          V=$(grep -m1 'CURRENT_PROJECT_VERSION' tvbox-ios/project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$M" ] || [ -z "$V" ]; then
            echo "project.yml 里读不到版本号（MARKETING_VERSION / CURRENT_PROJECT_VERSION）"
            exit 1
          fi
          echo "marketing=$M" >> "$GITHUB_OUTPUT"
          echo "build=$V" >> "$GITHUB_OUTPUT"
          echo "tag=build$V" >> "$GITHUB_OUTPUT"
          echo "版本：$M (build $V)  →  Release tag: build$V"

      - name: 选择 Xcode
        run: |
          echo "镜像内的 Xcode："
          ls -d /Applications/Xcode*.app || true
          # xcodegen 生成 objectVersion 77 的工程，只有 Xcode 16+ 能读，
          # 所以不能用镜像默认（通常是 15.x），取最新正式版
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | grep -vi 'beta' | grep -vi 'GM' | grep -vi 'Release Candidate' \
            | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "找不到可用的正式版 Xcode"
            exit 1
          fi
          echo "选用：$LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 静态校验
        working-directory: tvbox-ios
        run: python3 tools/check.py

      - name: 规则解释器单测
        working-directory: tvbox-ios
        run: |
          # 不用 glob：文件缺一个就把字面量 tests/*.test.js 丢给 node，报 MODULE_NOT_FOUND。
          # 逐个点名，缺文件只提示不中断，免得测试目录没同步上去整个包出不掉。
          set +e
          if ! command -v node >/dev/null 2>&1; then
            echo "没有 node，跳过（不影响出包）"
            exit 0
          fi
          node -v
          ran=""
          missing=""
          for f in drpy_lite.test.js drpy_jsrule.test.js drpy_classparse.test.js drpy_netfail.test.js drpy_pyramid.test.js parse_webview.test.js; do
            if [ -f "tests/$f" ]; then
              echo "→ tests/$f"
              node "tests/$f"
              if [ $? -ne 0 ]; then
                echo "❌ tests/$f 未通过"
                exit 1
              fi
              ran="$ran $f"
            else
              echo "跳过（仓库里没有）：tests/$f"
              missing="$missing $f"
            fi
          done
          echo "已跑：${ran:- 无}"
          [ -n "$missing" ] && echo "缺失：$missing（重新解压源码包可补齐）"
          exit 0

      - name: 生成工程
        working-directory: tvbox-ios
        run: xcodegen generate --spec project.yml

      - name: 检查工程格式与 Xcode 是否匹配
        working-directory: tvbox-ios
        run: |
          VER=$(grep -m1 'objectVersion' TVBox.xcodeproj/project.pbxproj | tr -dc '0-9')
          XV=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          echo "objectVersion=$VER  Xcode 主版本=$XV"
          if [ "$VER" -ge 70 ] && [ "$XV" -lt 16 ]; then
            echo "格式过高：工程是 objectVersion $VER，当前 Xcode $XV 读不了"
            exit 1
          fi

      - name: 解析依赖
        working-directory: tvbox-ios
        run: xcodebuild -resolvePackageDependencies -project TVBox.xcodeproj -scheme TVBox

      # 关键：整段编译输出落到 build.log，失败时把 error: 行单独打出来。
      # 否则 Actions 折叠日志后只剩 "exit code 65" 一行，没法定位。
      - name: Archive（无签名）
        working-directory: tvbox-ios
        run: |
          set +e
          rm -rf build
          mkdir -p build
          xcodebuild archive \
            -project TVBox.xcodeproj \
            -scheme TVBox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/TVBox.xcarchive \
            -derivedDataPath build/dd \
            -resultBundlePath build/TVBox.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1
          STATUS=$?
          echo "xcodebuild 退出码：$STATUS"
          echo "================ 编译错误 ================"
          grep -n "error:" build.log | head -80 || echo "（日志中没有 error: 行，说明失败发生在链接/签名/打包阶段）"
          echo "================ 失败原因 ================"
          grep -nE "^(\*\* |error|fatal|clang: error|ld: )" build.log | head -40 || true
          echo "================ 日志尾部 50 行 ================"
          tail -50 build.log
          exit $STATUS

      - name: 上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-build-log
          path: |
            tvbox-ios/build.log
            tvbox-ios/build/TVBox.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: 打包 ipa
        working-directory: tvbox-ios
        run: |
          APP=build/TVBox.xcarchive/Products/Applications/TVBox.app
          test -d "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          rm -rf build/Payload/TVBox.app/_CodeSignature
          cd build && zip -qry TVBox.ipa Payload
          ls -lh TVBox.ipa
          unzip -l TVBox.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: TVBox-unsigned-ipa
          path: tvbox-ios/build/TVBox.ipa
          if-no-files-found: error

      - name: 发布到 Release
        # 只在 main 上推触发时发版；workflow_dispatch 也发，方便补包
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.marketing }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -e
          cd tvbox-ios
          shasum -a 256 build/TVBox.ipa | awk '{print $1"  TVBox.ipa"}' > build/TVBox.ipa.sha256
          cat build/TVBox.ipa.sha256

          COMMIT="${GITHUB_SHA::8}"
          {
            echo "### TVBox $VER (build $BUILD)"
            echo ""
            echo "未签名 ipa，装之前要自签：Sideloadly / AltStore（7 天，到期重签），或 TrollStore（免签，看系统支持）。"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| Bundle ID | \`osc.tvbox.jun\` |"
            echo "| 最低系统 | iOS 15.0 |"
            echo "| 构建 | GitHub Actions macos-15 / commit \`$COMMIT\` |"
            echo "| 校验 | \`shasum -a 256 -c TVBox.ipa.sha256\` |"
          } > /tmp/notes.md

          # 同名 tag / release 先清掉，重跑和改同一版号都不会撞
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" \
            build/TVBox.ipa \
            build/TVBox.ipa.sha256 \
            --title "TVBox $VER (build $BUILD)" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            --target "$GITHUB_SHA"
          echo "Release 已发布：$TAG"
