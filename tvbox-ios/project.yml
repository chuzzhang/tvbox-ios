name: TVBox
options:
  bundleIdPrefix: osc.tvbox
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    # 警告不当错误：Xcode 16 的并发/弃用提示很多，不该阻断出包
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    # Swift 6 的严格并发检查会把 AVPlayer/JSContext 这类老 API 判成错误
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES

schemes:
  TVBox:
    build:
      targets:
        TVBox: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  TVBox:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
      - package: ZIPFoundation
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: osc.tvbox.jun
        PRODUCT_NAME: TVBox
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "-ObjC"
