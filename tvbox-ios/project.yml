name: TVBox
options:
  bundleIdPrefix: osc.tvbox
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO

schemes:
  TVBox:
    build:
      targets:
        TVBox: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  TVBox:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
      - package: ZIPFoundation
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: osc.tvbox.jun
        PRODUCT_NAME: TVBox
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "-ObjC"
